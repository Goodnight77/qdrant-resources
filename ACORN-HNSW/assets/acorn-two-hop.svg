<svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="480" fill="#ffffff"/>

  <!-- ===================== LEFT PANEL: vanilla ===================== -->
  <rect x="20" y="20" width="455" height="440" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="247" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Vanilla filtered HNSW</text>
  <text x="247" y="74" text-anchor="middle" font-size="13" fill="#64748b">only first-hop neighbors, traversal gets stuck</text>

  <!-- edges -->
  <g stroke="#cbd5e1" stroke-width="1.6">
    <line x1="90" y1="270" x2="175" y2="200"/>
    <line x1="90" y1="270" x2="170" y2="330"/>
    <line x1="175" y1="200" x2="265" y2="160"/>
    <line x1="175" y1="200" x2="255" y2="255"/>
    <line x1="170" y1="330" x2="255" y2="255"/>
    <line x1="170" y1="330" x2="260" y2="370"/>
    <line x1="255" y1="255" x2="340" y2="220"/>
    <line x1="265" y1="160" x2="340" y2="220"/>
    <line x1="260" y1="370" x2="345" y2="330"/>
    <line x1="340" y1="220" x2="410" y2="270"/>
    <line x1="345" y1="330" x2="410" y2="270"/>
  </g>

  <!-- traversal path stops -->
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <line x1="90" y1="270" x2="175" y2="200" marker-end="url(#arrow)"/>
  </g>
  <!-- blocked marks -->
  <g stroke="#dc2626" stroke-width="3">
    <line x1="253" y1="148" x2="277" y2="172"/>
    <line x1="277" y1="148" x2="253" y2="172"/>
    <line x1="243" y1="243" x2="267" y2="267"/>
    <line x1="267" y1="243" x2="243" y2="267"/>
  </g>

  <!-- nodes -->
  <!-- entry -->
  <circle cx="90" cy="270" r="15" fill="#2563eb"/>
  <text x="90" y="303" text-anchor="middle" font-size="12" fill="#334155">entry</text>
  <!-- passes filter -->
  <circle cx="175" cy="200" r="13" fill="#16a34a"/>
  <circle cx="170" cy="330" r="13" fill="#94a3b8"/>
  <!-- filtered out (blockers) -->
  <circle cx="265" cy="160" r="13" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <circle cx="255" cy="255" r="13" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <circle cx="260" cy="370" r="13" fill="#94a3b8"/>
  <!-- targets behind the wall -->
  <circle cx="340" cy="220" r="13" fill="#16a34a"/>
  <circle cx="345" cy="330" r="13" fill="#94a3b8"/>
  <circle cx="410" cy="270" r="15" fill="#16a34a" stroke="#166534" stroke-width="3"/>
  <text x="410" y="303" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">true best match</text>

  <text x="247" y="430" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">filtered-out points act like a wall: the path is cut, recall drops</text>

  <!-- ===================== RIGHT PANEL: acorn ===================== -->
  <rect x="505" y="20" width="455" height="440" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="732" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">ACORN (Qdrant 1.16)</text>
  <text x="732" y="74" text-anchor="middle" font-size="13" fill="#64748b">jumps over filtered neighbors using the second hop</text>

  <!-- edges (same graph shape shifted +485) -->
  <g stroke="#cbd5e1" stroke-width="1.6">
    <line x1="575" y1="270" x2="660" y2="200"/>
    <line x1="575" y1="270" x2="655" y2="330"/>
    <line x1="660" y1="200" x2="750" y2="160"/>
    <line x1="660" y1="200" x2="740" y2="255"/>
    <line x1="655" y1="330" x2="740" y2="255"/>
    <line x1="655" y1="330" x2="745" y2="370"/>
    <line x1="740" y1="255" x2="825" y2="220"/>
    <line x1="750" y1="160" x2="825" y2="220"/>
    <line x1="745" y1="370" x2="830" y2="330"/>
    <line x1="825" y1="220" x2="895" y2="270"/>
    <line x1="830" y1="330" x2="895" y2="270"/>
  </g>

  <!-- traversal path with two-hop jumps -->
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <line x1="575" y1="270" x2="660" y2="200" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#16a34a" stroke-width="3" fill="none" stroke-dasharray="7 5">
    <path d="M 660 200 Q 745 165 825 213" marker-end="url(#arrowg)"/>
    <path d="M 825 220 Q 870 235 888 262" marker-end="url(#arrowg)"/>
  </g>
  <text x="745" y="140" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="600">2nd hop jump</text>

  <!-- nodes -->
  <circle cx="575" cy="270" r="15" fill="#2563eb"/>
  <text x="575" y="303" text-anchor="middle" font-size="12" fill="#334155">entry</text>
  <circle cx="660" cy="200" r="13" fill="#16a34a"/>
  <circle cx="655" cy="330" r="13" fill="#94a3b8"/>
  <circle cx="750" cy="160" r="13" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <circle cx="740" cy="255" r="13" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <circle cx="745" cy="370" r="13" fill="#94a3b8"/>
  <circle cx="825" cy="220" r="13" fill="#16a34a"/>
  <circle cx="830" cy="330" r="13" fill="#94a3b8"/>
  <circle cx="895" cy="270" r="15" fill="#16a34a" stroke="#166534" stroke-width="3"/>
  <text x="895" y="303" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">found it</text>

  <text x="732" y="430" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="600">filtered points are used as bridges, not destinations</text>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <circle cx="330" cy="462" r="7" fill="#16a34a"/><text x="342" y="466">passes filter</text>
    <circle cx="440" cy="462" r="7" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/><text x="452" y="466">filtered out</text>
    <circle cx="545" cy="462" r="7" fill="#94a3b8"/><text x="557" y="466">not visited</text>
  </g>
</svg>
