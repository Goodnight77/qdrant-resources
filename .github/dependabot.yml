version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "uv"
    directory: "/Quantization-FaceOff"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directories:
      - "/ACORN-HNSW"
      - "/FastEmbed-Cloud-Inference"
      - "/Multitenancy-Playbook"
      - "/Qdrant-1.19-hands-on"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "gomod"
    directory: "/bm25-go-hybrid"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker-compose"
    directories:
      - "/FastEmbed-Cloud-Inference"
      - "/Multitenancy-Playbook"
      - "/Qdrant-1.19-hands-on"
      - "/Quantization-FaceOff"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
